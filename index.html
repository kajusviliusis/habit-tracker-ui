<!DOCTYPE html>
<html lang="lt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Įpročių sekiklis</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="app-header">
    <h1 class="app-title">Įpročiai</h1>
    <nav class="app-nav">
      <button type="button" id="btn-today" class="nav-btn is-active">Šiandien</button>
      <button type="button" id="btn-progress" class="nav-btn">Pažanga</button>
    </nav>
  </header>

  <main class="app-main">
    <section id="view-today" class="view">
      <h2 class="view-title">Šiandien</h2>

      <button type="button" id="btn-add" class="btn-primary">+ Naujas įprotis</button>

      <div id="habit-form" class="card" hidden>
        <h3 id="form-title">Naujas įprotis</h3>

        <label for="habit-name" class="label">Pavadinimas</label>
        <div class="name-row">
          <input type="text" id="habit-name" maxlength="50" placeholder="Bėgioti 5 km">
          <span id="name-counter" class="counter">0/50</span>
        </div>

        <p class="label">Tipas</p>
        <div class="type-row">
          <label class="type-option todo">
            <input type="radio" name="type" id="type-todo"> To-Do
          </label>
          <label class="type-option nottodo">
            <input type="radio" name="type" id="type-nottodo"> Not-To-Do
          </label>
        </div>

        <p class="label">Dienos</p>
        <div class="quick-row">
          <button type="button" id="btn-weekdays" class="quick-btn">Darbo dienomis</button>
          <button type="button" id="btn-everyday" class="quick-btn">Kasdien</button>
        </div>
        <div class="days-row">
          <button type="button" class="day-btn" data-day="1">Pr</button>
          <button type="button" class="day-btn" data-day="2">An</button>
          <button type="button" class="day-btn" data-day="3">Tr</button>
          <button type="button" class="day-btn" data-day="4">Kt</button>
          <button type="button" class="day-btn" data-day="5">Pn</button>
          <button type="button" class="day-btn" data-day="6">Š</button>
          <button type="button" class="day-btn" data-day="0">S</button>
        </div>

        <p id="form-error" class="error"></p>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn-secondary">Atšaukti</button>
          <button type="button" id="btn-save" class="btn-primary">Išsaugoti</button>
        </div>
      </div>

      <p class="placeholder">Čia bus dienos įpročių sąrašas.</p>
    </section>

    <section id="view-progress" class="view" hidden>
      <h2 class="view-title">Pažanga</h2>
      <p class="placeholder">Čia bus langelių ir juostų rodiniai.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
